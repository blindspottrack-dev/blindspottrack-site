<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlindSpot Track</title>
<meta name="description" content="Discover hidden, spontaneous plans near you — one revealed event at a time.">
<link rel="stylesheet" href="/style.css">
<style>
  .hero { text-align: center; padding: 96px 0 48px; }
  .hero .mark { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px; }
  .hero .mark svg { width: 32px; height: 32px; }
  .hero h1 { font-size: 2.2rem; }
  .hero p.tag { color: var(--muted); font-size: 1.05rem; max-width: 480px; margin: 12px auto 32px; }
  .links { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .links a {
    text-decoration: none;
    color: var(--text);
    border: 1px solid var(--rule);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.95rem;
  }
  .links a:hover, .links a:focus-visible { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<main class="wrap">
  <div class="hero">
    <div class="mark" style="display:grid;place-items:center;background:linear-gradient(155deg,#3a1224,#17090f);border:1px solid rgba(224,69,154,.45);margin-left:auto;margin-right:auto;">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="3.2" stroke="#e0459a" stroke-width="1.6"/>
        <path d="M7 5.5c-1 0-1.5.5-1.5 1.5M17 5.5c1 0 1.5.5 1.5 1.5M7 18.5c-1 0-1.5-.5-1.5-1.5M17 18.5c1 0 1.5-.5 1.5-1.5" stroke="#e0459a" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>BlindSpot Track</h1>
    <p class="tag">Discover hidden, spontaneous plans near you — one revealed event at a time.</p>
    <div class="links">
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Service</a>
      <a href="mailto:support@blindspottrack.app">Contact</a>
    </div>
  </div>
</main>
</body>
</html>
